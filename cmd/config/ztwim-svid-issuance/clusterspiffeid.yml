apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: ztwim-perf-cspiffeid
  labels:
    kube-burner.io/test: ztwim-svid-issuance
spec:
  className: {{.SPIFFE_CLASS}}
  spiffeIDTemplate: "spiffe://{{ "{{" }} .TrustDomain {{ "}}" }}/ns/{{ "{{" }} .PodMeta.Namespace {{ "}}" }}/pod/{{ "{{" }} .PodMeta.Name {{ "}}" }}"
  ttl: "{{.SVID_TTL}}"
  podSelector:
    matchLabels:
      app: {{.APP_LABEL}}
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ztwim-perf
