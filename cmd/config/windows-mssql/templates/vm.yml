apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: windows-mssql-{{.Iteration}}-{{.Replica}}
  labels:
    kubevirt.io/vm: windows-mssql-{{.Iteration}}-{{.Replica}}
    app: mssql
    workload: windows-mssql
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        kubevirt.io/vm: windows-mssql-{{.Iteration}}-{{.Replica}}
        app: mssql
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{if eq .nodeDistribution "sequential"}}{{index (splitList " " .workerNodes) (div (default 0 .Iteration) (default 1 .vmsPerNode))}}{{else}}{{index (splitList " " .workerNodes) (mod (default 0 .Iteration) (default 1 .workerCount))}}{{end}}
      terminationGracePeriodSeconds: 180
      evictionStrategy: {{.evictionStrategy}}
      domain:
        firmware:
          bootloader:
            efi:
              secureBoot: false
        clock:
          timer:
            hpet:
              present: false
            hyperv: {}
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
          utc: {}
        cpu:
          cores: {{.vmCPU}}
          sockets: 1
          threads: 1
        ioThreads:
          supplementalPoolThreadCount: 8
        ioThreadsPolicy: supplementalPool
        devices:
          autoattachMemBalloon: false
          blockMultiQueue: true
          disks:
          - disk:
              bus: virtio
            name: rootdisk
            bootOrder: 1
          - disk:
              bus: virtio
            name: datadisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          inputs:
          - bus: virtio
            name: tablet
            type: tablet
          tpm: {}
          interfaces:
          - masquerade: {}
            model: virtio
            name: nic-0
          networkInterfaceMultiqueue: true
        features:
          acpi: {}
          apic: {}
          hyperv:
            frequencies: {}
            reenlightenment: {}
            reset: {}
            ipi: {}
            tlbflush: {}
            relaxed: {}
            runtime: {}
            spinlocks:
              spinlocks: 8191
            synic: {}
            synictimer:
              direct: {}
            vapic: {}
            vpindex: {}
          smm: {}
        machine:
          type: q35
        resources:
          requests:
            cpu: {{.vmCPURequest}}
            memory: {{.vmMemory}}
      networks:
      - name: nic-0
        pod: {}
      volumes:
      - dataVolume:
          name: windows-mssql-rootdisk-{{.Iteration}}-{{.Replica}}
        name: rootdisk
      - dataVolume:
          name: windows-mssql-datadisk-{{.Iteration}}-{{.Replica}}
        name: datadisk
      - cloudInitNoCloud:
          userData: |
            #cloud-config
            runcmd:
              - powershell -Command "New-Item -ItemType Directory -Force -Path 'C:\ProgramData\ssh' | Out-Null; Set-Content -Path 'C:\ProgramData\ssh\administrators_authorized_keys' -Value '{{.sshPublicKey}}' -Encoding ascii -Force; icacls 'C:\ProgramData\ssh\administrators_authorized_keys' /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'"
              - cmd /c "mkdir C:\Users\Administrator\.ssh >nul 2>&1 & icacls C:\Users\Administrator\.ssh /grant Everyone:F >nul 2>&1 & takeown /f C:\Users\Administrator\.ssh\authorized_keys >nul 2>&1 & icacls C:\Users\Administrator\.ssh\authorized_keys /grant Everyone:F >nul 2>&1 & del /f C:\Users\Administrator\.ssh\authorized_keys >nul 2>&1"
              - powershell -Command "Copy-Item 'C:\ProgramData\ssh\administrators_authorized_keys' 'C:\Users\Administrator\.ssh\authorized_keys' -Force; icacls 'C:\Users\Administrator\.ssh\authorized_keys' /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'; icacls 'C:\Users\Administrator\.ssh' /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'"
        name: cloudinitdisk
  dataVolumeTemplates:
  # Root disk - cloned from source DV
  - metadata:
      name: windows-mssql-rootdisk-{{.Iteration}}-{{.Replica}}
      annotations:
        descheduler.alpha.kubernetes.io/evict: "true"
{{- if .perNodeDV }}
        volume.kubernetes.io/selected-node: {{if eq .nodeDistribution "sequential"}}{{index (splitList " " .workerNodes) (div (default 0 .Iteration) (default 1 .vmsPerNode))}}{{else}}{{index (splitList " " .workerNodes) (mod (default 0 .Iteration) (default 1 .workerCount))}}{{end}}
{{- end }}
    spec:
      source:
{{- if .useSnapshot }}
        snapshot:
          namespace: {{.sourceNamespace}}
          name: windows-mssql-snapshot-{{if .perNodeDV}}{{if eq .nodeDistribution "sequential"}}{{div (default 0 .Iteration) (default 1 .vmsPerNode)}}{{else}}{{mod (default 0 .Iteration) (default 1 .workerCount)}}{{end}}{{else}}0{{end}}
{{- else }}
        pvc:
          namespace: {{.sourceNamespace}}
          name: {{.sourceDVName}}-{{if .perNodeDV}}{{if eq .nodeDistribution "sequential"}}{{div (default 0 .Iteration) (default 1 .vmsPerNode)}}{{else}}{{mod (default 0 .Iteration) (default 1 .workerCount)}}{{end}}{{else}}0{{end}}
{{- end }}
      storage:
        accessModes:
        - {{.accessMode}}
        volumeMode: Block
        resources:
          requests:
            storage: {{.rootDiskSize}}
        storageClassName: {{.storageClassName}}
  # Data disk - blank disk for SQL Server
  - metadata:
      name: windows-mssql-datadisk-{{.Iteration}}-{{.Replica}}
      annotations:
        descheduler.alpha.kubernetes.io/evict: "true"
{{- if .perNodeDV }}
        volume.kubernetes.io/selected-node: {{if eq .nodeDistribution "sequential"}}{{index (splitList " " .workerNodes) (div (default 0 .Iteration) (default 1 .vmsPerNode))}}{{else}}{{index (splitList " " .workerNodes) (mod (default 0 .Iteration) (default 1 .workerCount))}}{{end}}
{{- end }}
    spec:
      source:
        blank: {}
      storage:
        accessModes:
        - {{.accessMode}}
        volumeMode: Block
        resources:
          requests:
            storage: {{.dataDiskSize}}
        storageClassName: {{.storageClassName}}
