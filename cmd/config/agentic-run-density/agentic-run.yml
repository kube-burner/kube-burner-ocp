apiVersion: agentic.openshift.io/v1alpha1
kind: AgenticRun
metadata:
  name: agentic-run-density-{{.Iteration}}-{{.Replica}}
  namespace: openshift-lightspeed
spec:
  request: "{{.request}}{{ if .mockProfile }} [mock-profile:{{.mockProfile}}] [mock-ns:openshift-lightspeed]{{ end }}"
  analysis:
    agent: {{.agent}}
{{- if or (eq .workflow "analysis-execution") (eq .workflow "full") }}
  execution:
    agent: {{.agent}}
{{- end }}
{{- if eq .workflow "full" }}
  verification:
    agent: {{.agent}}
{{- end }}
