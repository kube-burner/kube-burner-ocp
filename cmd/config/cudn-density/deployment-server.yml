---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: server-{{.Replica}}
spec:
  replicas: {{.podReplicas}}
  selector:
    matchLabels:
      name: cudn-density-server-{{.Replica}}
  template:
    metadata:
      labels:
        name: cudn-density-server-{{.Replica}}
        app: nginx
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: nginx
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists
              - key: node-role.kubernetes.io/infra
                operator: DoesNotExist
              - key: node-role.kubernetes.io/workload
                operator: DoesNotExist
      {{ if .bgp }}
      securityContext:
        # sshd requires root to setuid() into the target login user (sshtest)
        # after pubkey authentication succeeds. The privileged SCC
        # (scc-rolebinding.yml) is needed to admit pods with runAsUser: 0.
        runAsUser: 0
      {{ end }}
      containers:
      - image: {{ if .bgp }}quay.io/cloud-bulldozer/nginx-ssh:latest{{ else }}quay.io/cloud-bulldozer/nginx:latest{{ end }}
        resources:
          requests:
            memory: "10Mi"
            cpu: "10m"
        volumeMounts:
        - name: podinfo
          mountPath: /etc/podlabels
        {{ if .bgp }}
        - name: ssh-authorized-keys
          mountPath: /etc/ssh-authorized-keys
          readOnly: true
        {{ end }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        {{ if .bgp }}
        - name: ssh
          containerPort: 22
          protocol: TCP
        {{ end }}
        name: nginx
      volumes:
      - name: podinfo
        downwardAPI:
          items:
            - path: "labels"
              fieldRef:
                fieldPath: metadata.labels
      {{ if .bgp }}
      - name: ssh-authorized-keys
        secret:
          secretName: {{ .sshPublicKeySecretName }}
          items:
            - key: key
              path: authorized_keys
      {{ end }}
