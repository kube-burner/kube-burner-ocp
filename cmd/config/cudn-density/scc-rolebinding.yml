---
# Grants the namespace's default ServiceAccount the privileged SCC so that
# server pods can run as root (runAsUser: 0). sshd requires root to
# setuid() into the login user (sshtest) after authentication, and the
# default restricted SCC does not permit runAsUser: 0.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cudn-density-scc-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: default
