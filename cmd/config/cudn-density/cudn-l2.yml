# CUDN CIDR allocation uses RFC1918 range 10.132.0.0 - 10.255.255.255, avoiding:
#   - AWS VPC (10.0.0.0/16), OCP pod network (10.128.0.0/14)
#   - OVN-K internals (100.64.0.0/16 join, 100.88.0.0/16 transit)
#
# Layer2 uses a flat network (no per-node subnet splitting), so "Max nodes"
# is unlimited — the only constraint is total pod IPs fitting in the CIDR.
#
#   CIDR prefix | perBlock | IPs/CUDN | Max CUDNs
#   /16         | 1        | 65534    | 124
#   /17         | 2        | 32766    | 248
#   /18         | 4        | 16382    | 496
#   /19         | 8        | 8190     | 992
#   /20         | 16       | 4094     | 1984
#   /21         | 32       | 2046     | 3968
#   /22         | 64       | 1022     | 7936
#   /23         | 128      | 510      | 15872
#   /24         | 256      | 254      | 31744
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: cudn-{{.Iteration}}
  labels:
    ra-{{ div .Iteration (int .cudns_per_ra) }}: ""
spec:
  {{- $nsList := list }}
  {{- $nsStart := mul $.Iteration $.namespaces_per_cudn }}
  {{- range $i, $v := until $.namespaces_per_cudn }}
    {{- $nextNs := mod (add $nsStart $i) $.total_namespaces }}
    {{- $next_namespace := print "cudn-density-" $nextNs }}
    {{- $nsList = append $nsList $next_namespace }}
  {{- end }}
  {{- $nsNames := toJson $nsList }}
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values: {{$nsNames}}
  {{- $perBlock := 256 }}
  {{- $secondOctet := add 132 (div $.Iteration $perBlock) }}
  {{- $thirdOctet := mod $.Iteration $perBlock }}
  {{- $cudnCidr := printf "10.%d.%d.0/24" $secondOctet $thirdOctet }}
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets: [{{$cudnCidr}}]
