---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: app-{{.Replica}}
spec:
  replicas: {{.podReplicas}}
  selector:
    matchLabels:
      name: cudn-density-app-{{.Replica}}
  template:
    metadata:
      labels:
        name: cudn-density-app-{{.Replica}}
        app: sampleapp
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: sampleapp
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists
              - key: node-role.kubernetes.io/infra
                operator: DoesNotExist
              - key: node-role.kubernetes.io/workload
                operator: DoesNotExist
      containers:
      - name: hloader
        {{ if .httpServerAddress }}
        image: quay.io/cloud-bulldozer/hloader:latest
        command:
          - "/bin/sh"
          - "-c"
          - |
            while true; do
              hloader --url http://{{.httpServerAddress}} --rate {{.httpLoadTestRate}} --duration 1m
            done
        {{ else }}
        image: quay.io/cloud-bulldozer/sampleapp:latest
        command: ["sleep", "infinity"]
        {{ end }}
        resources:
          requests:
            memory: "10Mi"
            cpu: "10m"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        securityContext:
          privileged: false
      restartPolicy: Always
