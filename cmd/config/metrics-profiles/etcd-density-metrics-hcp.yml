# Etcd density metrics profile — HCP (Hosted Control Plane) variant
# Comprehensive etcd-focused metrics aligned with the etcd-on-cluster Grafana dashboard.
# Targets etcd and kube-apiserver pods running in the HCP namespace on the management cluster.
#
# Required: set HOSTED_CLUSTER_NAMESPACE to the HCP namespace (e.g. "clusters-my-cluster")
# via --set HOSTED_CLUSTER_NAMESPACE=clusters-my-cluster

# ---------------------------------------------------------------------------
# Etcd DB size (time series)
# ---------------------------------------------------------------------------

- query: avg by (pod) (etcd_mvcc_db_total_size_in_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"})
  metricName: etcdDBTotalSize

- query: avg by (pod) (etcd_mvcc_db_total_size_in_use_in_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"})
  metricName: etcdDBSizeInUse

- query: avg by (pod) (etcd_mvcc_db_total_size_in_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) - avg by (pod) (etcd_mvcc_db_total_size_in_use_in_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"})
  metricName: etcdDBFragmentationBytes

- query: etcd_server_quota_backend_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdQuotaBackendBytes

- query: (etcd_mvcc_db_total_size_in_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"} / etcd_server_quota_backend_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) * 100
  metricName: etcdDBSpaceUsed

- query: etcd_server_quota_backend_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"} - etcd_mvcc_db_total_size_in_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdDBLeftCapacity

# ---------------------------------------------------------------------------
# Etcd disk I/O latency — p99 (time series)
# ---------------------------------------------------------------------------

- query: histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (pod, le))
  metricName: 99thEtcdDiskWalFsyncDurationSeconds

- query: histogram_quantile(0.99, sum(rate(etcd_disk_backend_commit_duration_seconds_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (pod, le))
  metricName: 99thEtcdDiskBackendCommitDurationSeconds

# ---------------------------------------------------------------------------
# Etcd disk I/O rates (time series)
# ---------------------------------------------------------------------------

- query: irate(etcd_disk_wal_fsync_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdDiskWalFsyncSum

- query: etcd_disk_wal_fsync_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdDiskWalFsyncDurationTotal

- query: irate(etcd_disk_wal_fsync_duration_seconds_count{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdDiskWalFsyncCount

- query: etcd_disk_wal_fsync_duration_seconds_count{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdDiskWalFsyncCountTotal

- query: irate(etcd_disk_backend_commit_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdDiskBackendCommitSum

- query: etcd_disk_backend_commit_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdDiskBackendCommitDurationTotal

- query: irate(etcd_disk_backend_commit_duration_seconds_count{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdDiskBackendCommitCount

- query: etcd_disk_backend_commit_duration_seconds_count{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdDiskBackendCommitCountTotal

- query: rate(container_fs_writes_bytes_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", container=~"etcd|etcd-events", device!~".+dm.+"}[2m])
  metricName: etcdContainerDiskWrites

# ---------------------------------------------------------------------------
# Compaction and defrag (time series)
# ---------------------------------------------------------------------------

- query: delta(etcd_debugging_mvcc_db_compaction_total_duration_milliseconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[1m:30s])/2 > 0
  metricName: 99thEtcdCompaction

- query: etcd_debugging_mvcc_db_compaction_total_duration_milliseconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdCompactionDurationTotal

- query: delta(etcd_disk_backend_defrag_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[1m:30s])/2 > 0
  metricName: 99thEtcdDefrag

- query: etcd_disk_backend_defrag_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdDefragDurationTotal

- query: rate(node_vmstat_pgmajfault[2m]) * on (instance) group_left label_replace(max by (node) (kube_pod_info{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", pod=~"etcd-.*"}), "instance", "$1", "node", "(.*)")
  metricName: etcdNodeMajorPageFaults

- query: node_vmstat_pgmajfault * on (instance) group_left label_replace(max by (node) (kube_pod_info{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", pod=~"etcd-.*"}), "instance", "$1", "node", "(.*)")
  metricName: etcdNodeMajorPageFaultsTotal

- query: sum(rate(etcd_debugging_snap_save_total_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m]))
  metricName: etcdSnapshotDuration

# ---------------------------------------------------------------------------
# Etcd network traffic (time series)
# NOTE: Peer metrics (round-trip, peer traffic) are omitted — HCP etcd runs
# as a single replica with no peers.
# ---------------------------------------------------------------------------

- query: rate(etcd_network_client_grpc_received_bytes_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdGRPCTrafficReceived

- query: rate(etcd_network_client_grpc_sent_bytes_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdGRPCTrafficSent

- query: sum(rate(container_network_receive_bytes_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (pod)
  metricName: etcdContainerNetworkReceived

- query: sum(rate(container_network_transmit_bytes_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (pod)
  metricName: etcdContainerNetworkTransmitted

# ---------------------------------------------------------------------------
# Active gRPC streams (time series)
# NOTE: grpc_server_handling_seconds_bucket (GRPC latency p99) is omitted —
# not exposed by HCP etcd.
# ---------------------------------------------------------------------------

- query: sum by (pod) (grpc_server_started_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", grpc_service="etcdserverpb.Watch", grpc_type="bidi_stream"}) - sum by (pod) (grpc_server_handled_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", grpc_service="etcdserverpb.Watch", grpc_type="bidi_stream"})
  metricName: etcdActiveWatchStreams

- query: sum by (pod) (grpc_server_started_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", grpc_service="etcdserverpb.Lease", grpc_type="bidi_stream"}) - sum by (pod) (grpc_server_handled_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", grpc_service="etcdserverpb.Lease", grpc_type="bidi_stream"})
  metricName: etcdActiveLeaseStreams

# ---------------------------------------------------------------------------
# Raft proposals (time series)
# ---------------------------------------------------------------------------

- query: sum by (pod) (rate(etcd_server_proposals_committed_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m]))
  metricName: etcdProposalsCommittedRate

- query: sum by (pod) (rate(etcd_server_proposals_failed_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m]))
  metricName: etcdProposalsFailedRate

- query: sum by (pod) (rate(etcd_server_proposals_applied_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m]))
  metricName: etcdProposalsAppliedRate

- query: sum by (pod) (etcd_server_proposals_pending{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"})
  metricName: etcdProposalsPending

# ---------------------------------------------------------------------------
# Leader health (time series)
# ---------------------------------------------------------------------------

- query: sum by (pod) (rate(etcd_server_leader_changes_seen_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m]))
  metricName: etcdLeaderChangesRate

- query: max by (pod) (etcd_server_has_leader{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"})
  metricName: etcdHasLeader

- query: changes(etcd_server_leader_changes_seen_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[1d])
  metricName: etcdLeaderElectionsPerDay

# ---------------------------------------------------------------------------
# Slow operations (time series)
# ---------------------------------------------------------------------------

- query: delta(etcd_server_slow_apply_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdSlowApply

- query: delta(etcd_server_slow_read_indexes_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdSlowReadIndexes

# ---------------------------------------------------------------------------
# Key operations (time series)
# ---------------------------------------------------------------------------

- query: rate(etcd_mvcc_put_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdPutRate

- query: rate(etcd_mvcc_delete_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])
  metricName: etcdDeleteRate

- query: etcd_debugging_mvcc_keys_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdKeys

- query: etcd_debugging_mvcc_db_compaction_keys_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdCompactedKeys

# ---------------------------------------------------------------------------
# Heartbeat and health failures (time series)
# ---------------------------------------------------------------------------

- query: etcd_server_heartbeat_send_failures_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdHeartbeatFailures

- query: etcd_server_health_failures{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdHealthFailures

# ---------------------------------------------------------------------------
# Etcd storage objects (time series)
# ---------------------------------------------------------------------------

- query: topk(20, max by (resource) (apiserver_resource_objects{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}))
  metricName: etcdStorageObjects

# ---------------------------------------------------------------------------
# Container resources — etcd + kube-apiserver in HCP namespace (time series)
# ---------------------------------------------------------------------------

- query: (sum(irate(container_cpu_usage_seconds_total{name!="", container!~"POD|", namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", container=~"etcd|etcd-metrics|etcd-events|kube-apiserver"}[2m]) * 100) by (container, pod, namespace)) > 0
  metricName: containerCPU

- query: sum(container_memory_working_set_bytes{name!="", container!~"POD|", namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", container=~"etcd|etcd-metrics|etcd-events|kube-apiserver"}) by (container, pod, namespace)
  metricName: containerMemory

# ---------------------------------------------------------------------------
# Etcd event rates (time series)
# ---------------------------------------------------------------------------

- query: sum(rate(apiserver_request_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", job="kube-apiserver", resource="events", verb=~"POST|PUT|DELETE|PATCH"}[2m]))
  metricName: etcdEventWriteRate

- query: sum(rate(apiserver_request_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", job="kube-apiserver", resource="events", verb=~"LIST|GET"}[2m]))
  metricName: etcdEventReadRate

- query: cluster:usage:resources:sum{resource="events"}
  metricName: clusterEventCount

# ---------------------------------------------------------------------------
# API server (time series) — kube-apiserver pods in HCP namespace
# ---------------------------------------------------------------------------

- query: histogram_quantile(0.99, sum(irate(apiserver_request_duration_seconds_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", verb=~"LIST|GET", subresource!~"log|exec|portforward|attach|proxy"}[2m])) by (le, resource, verb, scope)) > 0
  metricName: readOnlyAPICallsLatency

- query: histogram_quantile(0.99, sum(irate(apiserver_request_duration_seconds_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", verb=~"POST|PUT|DELETE|PATCH", subresource!~"log|exec|portforward|attach|proxy"}[2m])) by (le, resource, verb, scope)) > 0
  metricName: mutatingAPICallsLatency

- query: sum(irate(apiserver_request_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", job="kube-apiserver", verb!="WATCH"}[2m])) by (verb, resource, code) > 0
  metricName: APIRequestRate

- query: sum(irate(apiserver_request_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", job="kube-apiserver", verb!="WATCH", code=~"5.."}[2m])) by (verb, resource, code) > 0
  metricName: APIServerErrors

- query: histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", subresource!="log", verb!~"WATCH|WATCHLIST|PROXY"}[2m])) by (verb, le))
  metricName: requestDuration99thByVerb

- query: histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", subresource!="log", verb!~"WATCH|WATCHLIST|PROXY"}[2m])) by (resource, le))
  metricName: requestDuration99thByResource

- query: sum(rate(apiserver_request_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", job="kube-apiserver"}[2m])) by (instance)
  metricName: requestRateByInstance

- query: sum(rate(apiserver_request_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", job="kube-apiserver"}[2m])) by (resource)
  metricName: requestRateByResource

- query: sum(rate(apiserver_request_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", job="kube-apiserver"}[2m])) by (code)
  metricName: requestRateByStatusCode

- query: sum(rate(apiserver_request_terminations_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (verb)
  metricName: requestRateDropped

- query: sum(rate(apiserver_request_terminations_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (component)
  metricName: requestRateTerminated

- query: sum(apiserver_longrunning_requests{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) by (instance)
  metricName: requestsLongRunning

- query: sum(apiserver_current_inflight_requests{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) by (instance, request_kind)
  metricName: requestInFlight

- query: histogram_quantile(0.99, sum(rate(apiserver_response_sizes_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (instance, le))
  metricName: responseSize99th

# ---------------------------------------------------------------------------
# Scheduler (time series)
# ---------------------------------------------------------------------------

- query: sum(irate(scheduler_schedule_attempts_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}", result="scheduled"}[2m]))
  metricName: schedulerThroughput

- query: histogram_quantile(0.99, sum(rate(scheduler_pod_scheduling_sli_duration_seconds_bucket{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m])) by (le))
  metricName: 99thSchedulerE2ELatency

# ---------------------------------------------------------------------------
# HCP control plane pod node resource usage (time series)
# ---------------------------------------------------------------------------

- query: (sum(irate(container_cpu_usage_seconds_total{name!="", namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m]) * 100) by (node)) > 0
  metricName: nodeCPU-ControlPlaneHosts

- query: sum(container_memory_working_set_bytes{name!="", namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) by (node)
  metricName: nodeMemory-ControlPlaneHosts

- query: (sum(irate(container_cpu_usage_seconds_total{name!="", container!~"POD|", namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}[2m]) * 100) by (container, node, pod)) > 0
  metricName: cpuPercent-ControlPlane

- query: sum(container_memory_working_set_bytes{name!="", container!~"POD|", namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) by (container, node, pod)
  metricName: memoryRSS-ControlPlane

# ---------------------------------------------------------------------------
# Instant queries: single-value snapshots captured at start and end of test
# ---------------------------------------------------------------------------

- query: etcd_mvcc_db_total_size_in_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdDBTotalSizeSnapshot
  instant: true
  captureStart: true

- query: etcd_server_proposals_committed_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdProposalsCommitted
  instant: true
  captureStart: true

- query: etcd_server_slow_apply_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdSlowApplyTotal
  instant: true
  captureStart: true

- query: etcd_server_leader_changes_seen_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: etcdLeaderChanges
  instant: true
  captureStart: true

- query: etcd_debugging_mvcc_db_compaction_total_duration_milliseconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: 99thEtcdCompaction-raw
  instant: true
  captureStart: true

- query: etcd_disk_backend_defrag_duration_seconds_sum{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}
  metricName: 99thEtcdDefrag-raw
  instant: true
  captureStart: true

- query: topk(20, max by (resource) (apiserver_resource_objects{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}))
  metricName: etcdStorageObjectsSnapshot
  instant: true
  captureStart: true

- query: sum by (cluster_version)(etcd_cluster_version{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"})
  metricName: etcdVersion
  instant: true

- query: sum(container_cpu_usage_seconds_total{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) by (container, node, pod)
  metricName: cpuSeconds-ControlPlane
  instant: true
  captureStart: true

- query: sum(container_memory_working_set_bytes{namespace="{{.HOSTED_CLUSTER_NAMESPACE}}"}) by (container, node, pod)
  metricName: memoryRSS-ControlPlane
  instant: true
  captureStart: true
