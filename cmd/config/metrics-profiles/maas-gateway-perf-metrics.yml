# MaaS Gateway Performance Metrics

# Istio/Envoy gateway request duration histograms

- query: histogram_quantile(0.50, sum(irate(istio_request_duration_milliseconds_bucket{reporter="destination", destination_workload_namespace="openshift-ingress"}[2m])) by (le, destination_workload))
  metricName: gatewayRequestDurationP50

- query: histogram_quantile(0.95, sum(irate(istio_request_duration_milliseconds_bucket{reporter="destination", destination_workload_namespace="openshift-ingress"}[2m])) by (le, destination_workload))
  metricName: gatewayRequestDurationP95

- query: histogram_quantile(0.99, sum(irate(istio_request_duration_milliseconds_bucket{reporter="destination", destination_workload_namespace="openshift-ingress"}[2m])) by (le, destination_workload))
  metricName: gatewayRequestDurationP99

# Authorino auth config evaluation duration

- query: histogram_quantile(0.95, sum(irate(auth_server_authconfig_duration_seconds_bucket{namespace="openshift-ingress"}[2m])) by (le, authconfig))
  metricName: authorinoAuthConfigDurationP95

# Authorino evaluator duration

- query: histogram_quantile(0.95, sum(irate(auth_server_evaluator_duration_seconds_bucket{namespace="openshift-ingress"}[2m])) by (le, evaluator))
  metricName: authorinoEvaluatorDurationP95

# Container CPU rate for MaaS components in openshift-ingress namespace

- query: sum(irate(container_cpu_usage_seconds_total{name!="", container!="POD", namespace="openshift-ingress", pod=~"maas-gateway.*|payload-processing.*|llm-d-inference-sim.*|maas-api.*"}[2m]) * 100) by (container, pod, namespace)
  metricName: maasContainerCPU

# Container CPU rate for test infra in maas-perf-test namespace

- query: sum(irate(container_cpu_usage_seconds_total{name!="", container!="POD", namespace="maas-perf-test"}[2m]) * 100) by (container, pod, namespace)
  metricName: testInfraContainerCPU

# Container memory for MaaS components in openshift-ingress namespace

- query: sum(container_memory_rss{name!="", container!="POD", namespace="openshift-ingress", pod=~"maas-gateway.*|payload-processing.*|llm-d-inference-sim.*|maas-api.*"}) by (container, pod, namespace)
  metricName: maasContainerMemory

# Container memory for test infra in maas-perf-test namespace

- query: sum(container_memory_rss{name!="", container!="POD", namespace="maas-perf-test"}) by (container, pod, namespace)
  metricName: testInfraContainerMemory

# Limitador metrics

- query: sum(irate(limitador_authorized_calls_total{namespace="openshift-ingress"}[2m])) by (limitador)
  metricName: limitadorAuthorizedCallsRate

- query: sum(irate(limitador_limited_calls_total{namespace="openshift-ingress"}[2m])) by (limitador)
  metricName: limitadorLimitedCallsRate

# Gateway request counts and rates

- query: sum(irate(istio_requests_total{reporter="destination", destination_workload_namespace="openshift-ingress"}[2m])) by (destination_workload, response_code)
  metricName: gatewayRequestRate

- query: sum(istio_requests_total{reporter="destination", destination_workload_namespace="openshift-ingress"}) by (destination_workload, response_code)
  metricName: gatewayRequestCount
  instant: true
