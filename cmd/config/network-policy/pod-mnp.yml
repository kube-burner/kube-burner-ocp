apiVersion: v1
kind: Pod
metadata:
  name: test-pod-{{.Replica}}
  labels:
    num: "{{.Replica}}"
    role: mnp-workload
  annotations:
    {{- $vlanId := add (div $.Iteration .namespaces_per_vlan) 1}}
    k8s.v1.cni.cncf.io/networks: br-ex-vlan-{{$vlanId}}
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/worker
            operator: Exists
          - key: node-role.kubernetes.io/infra
            operator: DoesNotExist
          - key: node-role.kubernetes.io/workload
            operator: DoesNotExist
  containers:
  - name: webserver
    image: quay.io/cloud-bulldozer/sampleapp:latest
    resources:
      requests:
        memory: "10Mi"
        cpu: "10m"
    imagePullPolicy: IfNotPresent
    ports:
     - containerPort: 8080
       protocol: TCP
    securityContext:
       privileged: false
  - name: curlapp
    image: quay.io/cloud-bulldozer/netpolvalidator:latest
    resources:
      requests:
        memory: "10Mi"
        cpu: "10m"
    imagePullPolicy: IfNotPresent
    ports:
     - containerPort: 9001
       protocol: TCP
    securityContext:
       privileged: false
