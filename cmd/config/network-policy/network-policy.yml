---
global:
  gc: true
  gcMetrics: false
  measurements:
{{ if .NETPOL_LATENCY }}
    - name: netpolLatency
{{ if ne .NETPOL_READY_THRESHOLD 0 }}
      thresholds:
        - conditionType: Ready
          metric: P99
          threshold: {{.NETPOL_READY_THRESHOLD}}
{{ end }}
{{ end }}
{{ if .MULTI_NETWORK_POLICY }}
    - name: mnpLatency
{{ end }}        
metricsEndpoints:
{{ if .ES_SERVER }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{ end }}
{{ if .LOCAL_INDEXING }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      type: local
      metricsDirectory: collected-metrics-{{.UUID}}
{{ end }}

jobs:
  - name: network-policy-perf-pods
    namespace: network-policy-perf
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: true
    podWait: false
    waitWhenFinished: {{ if .VIRT }}false{{ else }}true{{ end }}
    preLoadImages: false
    jobPause: {{ if .VIRT }}{{.VM_STARTUP_PAUSE}}{{ else }}15s{{ end }}
    skipIndexing: true
    namespaceLabels:
      kube-burner.io/skip-networkpolicy-latency: true
      security.openshift.io/scc.podSecurityLabelSync: false
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
    objects:
{{ if .MULTI_NETWORK_POLICY }}
      - objectTemplate: nncp.yml
        replicas: {{.VLANS}}
        runOnce: true

      - objectTemplate: nad-vlan.yml
        replicas: 1
        inputVars:
          namespaces_per_vlan: {{.NAMESPACES_PER_VLAN}}
{{ end }}

{{ if not .VIRT }}
{{ if .MULTI_NETWORK_POLICY }}
      - objectTemplate: pod-mnp.yml
        replicas: {{.PODS_PER_NAMESPACE}}
        inputVars:
          namespaces_per_vlan: {{.NAMESPACES_PER_VLAN}}
{{ else }}
      - objectTemplate: pod.yml
        replicas: {{.PODS_PER_NAMESPACE}}
{{ end }}
{{ else }}
      - objectTemplate: vm-localnet.yml
        replicas: {{.VMS_PER_NAMESPACE}}
        inputVars:
          namespaces_per_vlan: {{.NAMESPACES_PER_VLAN}}
{{ end }}

{{ if not .MULTI_NETWORK_POLICY }}
      - objectTemplate: np-deny-all.yml
        replicas: 1
{{ else }}
      - objectTemplate: mnp-deny-all.yml
        replicas: 1
        inputVars:
          namespaces_per_vlan: {{.NAMESPACES_PER_VLAN}}
{{ end }}

{{ if not .MULTI_NETWORK_POLICY }}
      - objectTemplate: np-allow-from-proxy.yml
        replicas: 1
{{ end }}
  - name: network-policy-perf
    namespace: network-policy-perf
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: true
    podWait: false
    waitWhenFinished: true
    preLoadImages: false
    jobPause: 1m
    cleanup: false
    namespaceLabels:
      security.openshift.io/scc.podSecurityLabelSync: false
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
    objects:
{{ if not .MULTI_NETWORK_POLICY }}
      - objectTemplate: ingress-np.yml
{{ else }}
      - objectTemplate: ingress-mnp.yml
{{ end }}
        replicas: {{.NETPOLS_PER_NAMESPACE}}
        inputVars:
{{ if not .MULTI_NETWORK_POLICY }}
          namespaces: {{.JOB_ITERATIONS}}
{{ else }}
          namespaces_per_vlan: {{.NAMESPACES_PER_VLAN}}
{{ end }}
          pods_per_namespace: {{.PODS_PER_NAMESPACE}}
          netpols_per_namespace: {{.NETPOLS_PER_NAMESPACE}}
          local_pods: {{.LOCAL_PODS}}
          pod_selectors: {{.POD_SELECTORS}}
          single_ports: {{.SINGLE_PORTS}}
          port_ranges: {{.PORT_RANGES}}
          peer_namespaces: {{.REMOTE_NAMESPACES}}
          peer_pods: {{.REMOTE_PODS}}
          cidr_rules: {{.CIDRS}}
          except_rules: {{.EXCEPT_RULES}}
{{ if not .NETPOL_LATENCY }}
{{ if not .MULTI_NETWORK_POLICY }}
      - objectTemplate: egress-np.yml
{{ else }}
      - objectTemplate: egress-mnp.yml
{{ end }}
        replicas: {{.NETPOLS_PER_NAMESPACE}}
        inputVars:
{{ if not .MULTI_NETWORK_POLICY }}
          namespaces: {{.JOB_ITERATIONS}}
{{ else }}
          namespaces_per_vlan: {{.NAMESPACES_PER_VLAN}}
{{ end }}
          pods_per_namespace: {{.PODS_PER_NAMESPACE}}
          netpols_per_namespace: {{.NETPOLS_PER_NAMESPACE}}
          local_pods: {{.LOCAL_PODS}}
          pod_selectors: {{.POD_SELECTORS}}
          single_ports: {{.SINGLE_PORTS}}
          port_ranges: {{.PORT_RANGES}}
          peer_namespaces: {{.REMOTE_NAMESPACES}}
          peer_pods: {{.REMOTE_PODS}}
          cidr_rules: {{.CIDRS}}
          except_rules: {{.EXCEPT_RULES}}
{{ end }}
