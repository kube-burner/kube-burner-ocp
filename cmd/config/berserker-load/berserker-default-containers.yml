- name: process-and-file-activity
  image: "quay.io/stackrox-io/berserker:1.0-92-gec43ada756"
  command:
  - berserker
  args:
  - -f
  - /etc/berserker/process-and-file-activity.ber
  resources:
    requests:
      memory: "200Mi"
      cpu: "30m"
    limits:
      memory: "200Mi"
      cpu: "30m"
  volumeMounts:
  - name: config
    mountPath: "/etc/berserker/process-and-file-activity.ber"
    subPath: process-and-file-activity.ber
    readOnly: true
  imagePullPolicy: IfNotPresent
  env:
  - name: RUST_LOG
    value: "error"
- name: endpoint-load
  image: "quay.io/stackrox-io/berserker:1.0-92-gec43ada756"
  resources:
    requests:
      memory: "100Mi"
      cpu: "25m"
    limits:
      memory: "180Mi"
      cpu: "25m"
  volumeMounts:
  - name: config
    mountPath: "/etc/berserker/workload.toml"
    subPath: endpoints.toml
    readOnly: true
  imagePullPolicy: IfNotPresent
  ports:
  - containerPort: 8080
    protocol: TCP
  - containerPort: 8443
    protocol: TCP
  env:
  - name: RUST_LOG
    value: "error"
- name: connection-load
  image: "quay.io/stackrox-io/berserker:network-1.0-92-gec43ada756"
  resources:
    requests:
      memory: "100Mi"
      cpu: "25m"
    limits:
      memory: "180Mi"
      cpu: "25m"
  volumeMounts:
  - name: config
    mountPath: "/etc/berserker/network-server.toml"
    subPath: network-server.toml
    readOnly: true
  - name: config
    mountPath: "/etc/berserker/network-client.toml"
    subPath: network-client.toml
    readOnly: true
  imagePullPolicy: IfNotPresent
  env:
  - name: RUST_LOG
    value: "error"
  - name: IP_BASE
    value: "__IP_BASE__"
  - name: BERSERKER__WORKLOAD__ADDRESS
    value: "__BERSERKER_ADDRESS__"
  securityContext:
    privileged: true
