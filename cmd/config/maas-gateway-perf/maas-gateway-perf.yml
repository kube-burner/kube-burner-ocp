---
{{ $guidellmImage := .GUIDELLM_IMAGE | default "quay.io/rsevilla/guidellm-parser:latest" }}
{{ $guidellmES := .ES_SERVER }}
{{ $guidellmESIndex := .ES_INDEX }}
{{ $samples := .SAMPLES | default 3 }}
{{ $parallelism := .PARALLELISM | default 1 }}
{{ $benchmarkDuration := .BENCHMARK_DURATION | default 90 }}
{{ $warmup := .WARMUP | default 30 }}
{{ $pause := .PAUSE | default "10s" }}
{{ $simulatorHost := .SIMULATOR_HOST }}
{{ $gatewayHost := .GATEWAY_HOST }}
{{ $gatewayIP := .GATEWAY_IP }}
{{ $uuid := .UUID }}

{{ $payloads := dict
  "small" (dict "prompt" "32" "output" "64")
  "medium" (dict "prompt" "256" "output" "512")
  "large" (dict "prompt" "1024" "output" "1024")
  "very-large" (dict "prompt" "2048" "output" "2048")
}}

{{ $selectedProviders := splitList "," .PROVIDERS }}
{{ $selectedPayloads := splitList "," .PAYLOAD_SIZES }}
{{ $concurrencyLevels := splitList "," .CONCURRENCY_LEVELS }}

global:
  gc: {{.GC}}
  gcMetrics: {{.GC_METRICS}}
  measurements:
    - name: jobLatency

metricsEndpoints:
{{ if .ES_SERVER }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{ end }}
{{ if .LOCAL_INDEXING }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      type: local
      metricsDirectory: collected-metrics-{{.UUID}}
{{ end }}

jobs:
  # -------------------------------------------------------
  # Baseline benchmarks — direct to simulator (no gateway)
  # -------------------------------------------------------
{{ range $provider := $selectedProviders }}
{{ range $size := $selectedPayloads }}
{{ $payload := get $payloads $size }}
{{ range $rate := $concurrencyLevels }}
  - name: baseline-{{ $size }}-{{ $provider }}-c{{ $rate }}
    namespace: maas-perf-test
    jobIterations: 1
    namespacedIterations: false
    gc: false
    cleanup: false
    preLoadImages: false
    qps: 5
    burst: 5
    objects:
    - objectTemplate: guidellm-job.yml
      inputVars:
        jobName: baseline-{{ $size }}-{{ $provider }}-c{{ $rate }}
        pause: {{ $pause }}
        parallelism: {{ $parallelism }}
        completions: {{ $samples }}
        env:
          GUIDELLM_TARGET: {{ $simulatorHost }}
          GUIDELLM_MAX_SECONDS: "{{ $benchmarkDuration }}"
          GUIDELLM_WARMUP: "{{ $warmup }}"
          GUIDELLM_PROFILE: constant
          GUIDELLM_RATE: "{{ $rate }}"
          GUIDELLM_DATA: "prompt_tokens={{ $payload.prompt }},output_tokens={{ $payload.output }}"
          GUIDELLM_MODEL: "{{ $provider }}"
        image: {{ $guidellmImage }}
        ES_SERVER: {{ $guidellmES }}
        ES_INDEX: {{ $guidellmESIndex }}
{{ end }}
{{ end }}
{{ end }}

  # -------------------------------------------------------
  # Gateway benchmarks — through MaaS gateway
  # -------------------------------------------------------
{{ range $provider := $selectedProviders }}
{{ range $size := $selectedPayloads }}
{{ $payload := get $payloads $size }}
{{ range $rate := $concurrencyLevels }}
  - name: gateway-{{ $size }}-{{ $provider }}-c{{ $rate }}
    namespace: maas-perf-test
    jobIterations: 1
    namespacedIterations: false
    gc: false
    cleanup: false
    preLoadImages: false
    qps: 5
    burst: 5
    objects:
    - objectTemplate: guidellm-job.yml
      inputVars:
        jobName: gateway-{{ $size }}-{{ $provider }}-c{{ $rate }}
        gatewayIP: {{ $gatewayIP }}
        gatewayHostname: {{ $.GATEWAY_HOSTNAME }}
        pause: {{ $pause }}
        parallelism: {{ $parallelism }}
        completions: {{ $samples }}
        env:
          GUIDELLM_TARGET: {{ $gatewayHost }}
          GUIDELLM_MAX_SECONDS: "{{ $benchmarkDuration }}"
          GUIDELLM_WARMUP: "{{ $warmup }}"
          GUIDELLM_PROFILE: constant
          GUIDELLM_RATE: "{{ $rate }}"
          GUIDELLM_DATA: "prompt_tokens={{ $payload.prompt }},output_tokens={{ $payload.output }}"
          GUIDELLM_MODEL: "{{ $provider }}"
        image: {{ $guidellmImage }}
        ES_SERVER: {{ $guidellmES }}
        ES_INDEX: {{ $guidellmESIndex }}
{{ end }}
{{ end }}
{{ end }}

  # -------------------------------------------------------
  # Cleanup
  # -------------------------------------------------------
  - name: cleanup
    namespace: maas-perf-test
    skipIndexing: true
    namespacedIterations: false
    jobType: delete
    waitForDeletion: true
