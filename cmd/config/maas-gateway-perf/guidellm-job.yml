apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-{{.jobName}}-{{.Replica}}
spec:
  completions: {{.completions}}
  parallelism: {{.parallelism}}
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/infra
                operator: DoesNotExist
              - key: node-role.kubernetes.io/worker
                operator: Exists
      restartPolicy: Never
      {{- if (index . "gatewayIP") }}
      hostAliases:
      - ip: "{{ .gatewayIP }}"
        hostnames:
        - "{{ .gatewayHostname }}"
      {{- end }}
      containers:
      - name: guidellm
        image: {{.image}}
        command: ["/bin/sh", "-c"]
        args:
        - |
          SA_TOKEN=""
          if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          fi
          guidellm benchmark run --backend-kwargs "{\"api_key\": \"${SA_TOKEN}\", \"verify\": false, \"validate_backend\": {\"method\": \"GET\", \"url\": \"${GUIDELLM_TARGET}/v1/models\", \"headers\": {\"Authorization\": \"Bearer ${SA_TOKEN}\"}}}"
          rc=$?
          {{- if .ES_SERVER }}
          guidellm_parser.py \
            --results=/results/benchmarks.json \
            --uuid={{ .UUID }} \
            --es-server={{ .ES_SERVER }} \
            --es-index={{ .ES_INDEX }} \
            --job-name={{ .jobName }} \
            --sample=${JOB_COMPLETION_INDEX}
          {{- end }}
          sleep {{ .pause }}
          exit $rc
        env:
        {{ range $k, $v := .env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{ end }}
        - name: GUIDELLM_PROCESSOR
          value: "gpt2"
        - name: HF_HOME
          value: /results
        volumeMounts:
        - name: results
          mountPath: /results
        resources:
          requests:
            cpu: "250m"
            memory: 256Mi
      volumes:
      - name: results
        emptyDir: {}
