apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-{{.jobName}}-{{.Replica}}
spec:
  completions: {{.completions}}
  parallelism: {{.parallelism}}
  completionMode: Indexed
  backoffLimit: 0
{{- if .jobDeadline }}
  activeDeadlineSeconds: {{ .jobDeadline }}
{{- end }}
  template:
    metadata:
      labels:
        app: guidellm
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/infra
                operator: DoesNotExist
              - key: node-role.kubernetes.io/worker
                operator: Exists
      restartPolicy: Never
      {{- if (index . "gatewayIP") }}
      hostAliases:
      - ip: "{{ .gatewayIP }}"
        hostnames:
        - "{{ .gatewayHostname }}"
      {{- end }}
      containers:
      - name: guidellm
        image: {{.image}}
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Backend validation is disabled: guidellm revalidates once per worker
          # process, and that startup burst makes the MaaS gateway return 500 for
          # one of the probes, which aborts the whole run. A genuinely unreachable
          # endpoint still surfaces immediately as errored requests.
          BACKEND="kind=openai_http,target=${BENCH_TARGET},model=${BENCH_MODEL}"
          BACKEND="${BACKEND},verify=false,validate_backend=false"
          # Per-identity simulation. Each indexed pod binds to one row of the
          # key pool, so a Job with parallelism=N drives the target as N
          # distinct tenants -- N distinct api_key_auth cache entries and N
          # distinct metering attributions -- instead of one shared credential.
          # Falls back to the ServiceAccount token when no pool is mounted.
          IDENTITY="serviceaccount"
          if [ -s /identities/keys.txt ]; then
            POOL_SIZE=$(grep -c . /identities/keys.txt)
            SLOT=$(( ${JOB_COMPLETION_INDEX:-0} % POOL_SIZE ))
            ROW=$(grep . /identities/keys.txt | sed -n "$((SLOT + 1))p")
            IDENTITY=$(printf '%s' "${ROW}" | cut -f1)
            BACKEND="${BACKEND},api_key=$(printf '%s' "${ROW}" | cut -f2)"
            echo "identity slot ${SLOT} of ${POOL_SIZE}: ${IDENTITY}"
          elif [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            BACKEND="${BACKEND},api_key=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          fi
          # Open-loop profiles (constant, poisson) take the level as a request
          # rate and keep sending regardless of how slow the backend gets.
          # The closed-loop profile (concurrent) takes it as a stream count and
          # self-throttles, so throughput becomes an output rather than an input.
          case "${BENCH_PROFILE}" in
            concurrent)
              PROFILE="kind=concurrent,streams=${BENCH_RATE}"
              ;;
            *)
              PROFILE="kind=${BENCH_PROFILE},rate=${BENCH_RATE}"
              ;;
          esac
          PROFILE="${PROFILE},warmup=${BENCH_WARMUP}"
          if [ -f /tokenizer/tokenizer.tar.gz ]; then
            mkdir -p /results/tokenizer
            tar xzf /tokenizer/tokenizer.tar.gz -C /results/tokenizer
          fi
          guidellm run \
            --backend "${BACKEND}" \
            --label "identity=${IDENTITY}" \
            --label "profile=${BENCH_PROFILE}" \
            --profile "${PROFILE}" \
            --constraint "kind=max_duration,seconds=${BENCH_MAX_SECONDS}" \
            --data "kind=synthetic_text,prompt_tokens=${BENCH_PROMPT_TOKENS},output_tokens=${BENCH_OUTPUT_TOKENS}" \
            --tokenizer "kind=huggingface_auto,model=${BENCH_TOKENIZER}" \
            --output "kind=json,path=/results/benchmarks.json" \
            --disable-progress
          rc=$?
          {{- if .ES_SERVER }}
          guidellm_parser.py \
            --results=/results/benchmarks.json \
            --uuid={{ .UUID }} \
            --es-server={{ .ES_SERVER }} \
            --es-index={{ .ES_INDEX }} \
            --job-name={{ .jobName }} \
            --sample=${JOB_COMPLETION_INDEX}
          {{- end }}
          exit $rc
        env:
        {{ range $k, $v := .env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{ end }}
        {{- if .tokenizerConfigMap }}
        # Pre-downloaded tokenizer: required on clusters with no egress to
        # huggingface.co, where AutoTokenizer.from_pretrained() otherwise
        # stalls and fails the pod. Shipped as a tarball because an
        # uncompressed gpt2 tokenizer (2.8MB) exceeds the 1MiB ConfigMap limit.
        - name: BENCH_TOKENIZER
          value: "/results/tokenizer"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        {{- else }}
        - name: BENCH_TOKENIZER
          value: "{{ .tokenizer | default "gpt2" }}"
        {{- end }}
        - name: HF_HOME
          value: /results
        volumeMounts:
        - name: results
          mountPath: /results
        {{- if .apiKeySecret }}
        - name: identities
          mountPath: /identities
          readOnly: true
        {{- end }}
        {{- if .tokenizerConfigMap }}
        - name: tokenizer
          mountPath: /tokenizer
          readOnly: true
        {{- end }}
        resources:
          requests:
            cpu: "250m"
            memory: 256Mi
      volumes:
      - name: results
        emptyDir: {}
      {{- if .apiKeySecret }}
      # Pool of simulated tenants: keys.txt holds one `user<TAB>key` row per
      # identity. Pods select their row by JOB_COMPLETION_INDEX.
      - name: identities
        secret:
          secretName: {{ .apiKeySecret }}
      {{- end }}
      {{- if .tokenizerConfigMap }}
      - name: tokenizer
        configMap:
          name: {{ .tokenizerConfigMap }}
      {{- end }}
