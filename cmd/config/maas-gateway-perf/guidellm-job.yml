apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-{{.jobName}}-{{.Replica}}
spec:
  completions: {{.completions}}
  parallelism: {{.parallelism}}
  completionMode: Indexed
  backoffLimit: 0
{{- if .jobDeadline }}
  activeDeadlineSeconds: {{ .jobDeadline }}
{{- end }}
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/infra
                operator: DoesNotExist
              - key: node-role.kubernetes.io/worker
                operator: Exists
      restartPolicy: Never
      {{- if (index . "gatewayIP") }}
      hostAliases:
      - ip: "{{ .gatewayIP }}"
        hostnames:
        - "{{ .gatewayHostname }}"
      {{- end }}
      containers:
      - name: guidellm
        image: {{.image}}
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Backend validation is disabled: guidellm revalidates once per worker
          # process, and that startup burst makes the MaaS gateway return 500 for
          # one of the probes, which aborts the whole run. A genuinely unreachable
          # endpoint still surfaces immediately as errored requests.
          BACKEND="kind=openai_http,target=${BENCH_TARGET},model=${BENCH_MODEL}"
          BACKEND="${BACKEND},verify=false,validate_backend=false"
          if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            BACKEND="${BACKEND},api_key=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          fi
          guidellm run \
            --backend "${BACKEND}" \
            --profile "kind=${BENCH_PROFILE},rate=${BENCH_RATE},warmup=${BENCH_WARMUP}" \
            --constraint "kind=max_duration,seconds=${BENCH_MAX_SECONDS}" \
            --data "kind=synthetic_text,prompt_tokens=${BENCH_PROMPT_TOKENS},output_tokens=${BENCH_OUTPUT_TOKENS}" \
            --tokenizer "kind=huggingface_auto,model=${BENCH_TOKENIZER}" \
            --output "kind=json,path=/results/benchmarks.json" \
            --disable-progress
          rc=$?
          {{- if .ES_SERVER }}
          guidellm_parser.py \
            --results=/results/benchmarks.json \
            --uuid={{ .UUID }} \
            --es-server={{ .ES_SERVER }} \
            --es-index={{ .ES_INDEX }} \
            --job-name={{ .jobName }} \
            --sample=${JOB_COMPLETION_INDEX}
          {{- end }}
          exit $rc
        env:
        {{ range $k, $v := .env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{ end }}
        - name: BENCH_TOKENIZER
          value: "gpt2"
        - name: HF_HOME
          value: /results
        volumeMounts:
        - name: results
          mountPath: /results
        resources:
          requests:
            cpu: "250m"
            memory: 256Mi
      volumes:
      - name: results
        emptyDir: {}
