apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-inference-sim
  namespace: {{.Namespace}}
  labels:
    app: llm-d-inference-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-inference-sim
  template:
    metadata:
      labels:
        app: llm-d-inference-sim
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: simulator
        image: quay.io/rh-ee-aharush/llm-d-inference-sim:multi-provider
        imagePullPolicy: Always
        args:
        - "--model"
        - "gpt-4o-openai"
        - "--served-model-name"
        - "gpt-4o-openai"
        - "gpt-4o-azure"
        - "gpt-4o-bedrock"
        - "claude-sonnet-anthropic"
        - "claude-sonnet-vertex"
        - "--port"
        - "8000"
        - "--mode"
        - "random"
        - "--providers"
        - "anthropic,azure,bedrock,vertexai"
        - "--max-model-len"
        - "8192"
        - "--max-num-seqs"
        - "1000"
        - "--time-to-first-token"
        - "1"
        - "--inter-token-latency"
        - "1"
        - "--deterministic-tokens"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
