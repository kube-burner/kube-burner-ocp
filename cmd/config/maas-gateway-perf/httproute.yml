apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perf-{{.providerName}}
  namespace: {{.Namespace}}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
    namespace: openshift-ingress
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /{{.providerName}}/
    backendRefs:
    - name: llm-d-inference-sim
      port: 8000
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
  - matches:
    - headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: {{.providerName}}
      path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: llm-d-inference-sim
      port: 8000
