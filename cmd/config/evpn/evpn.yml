# This workload has special hardware requirements.
# In order to meet those requirements we have added CI tests in e2e-benchmarking:
# https://github.com/openshift/release/tree/master/ci-operator/step-registry/cloud-bulldozer/e2e-benchmarking
---
global:
  gc: {{.GC}}
  gcMetrics: {{.GC_METRICS}}
  measurements:
    - name: podLatency
{{ if ne .POD_READY_THRESHOLD 0 }}
      thresholds:
        - conditionType: Ready
          metric: P99
          threshold: {{.POD_READY_THRESHOLD}}
{{ end }}
metricsEndpoints:
{{ if .ES_SERVER }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{ end }}
{{ if .LOCAL_INDEXING }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      type: local
      metricsDirectory: collected-metrics-{{.UUID}}
{{ end }}
jobs:
  - name: {{ if eq .CUDN_MODE "baseline" }}cudn-baseline{{ else }}evpn{{ end }}-{{.SCENARIO}}
    namespace: evpn
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: true
    podWait: false
    waitWhenFinished: true
    preLoadImages: true
    namespaceLabels:
      security.openshift.io/scc.podSecurityLabelSync: false
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
      k8s.ovn.org/primary-user-defined-network: ""
{{ if and .CREATE_EXT_FRR_VRF (eq .CUDN_MODE "evpn") }}
    hooks:
      - cmd: ["bash", "cleanup_external_frr_vrf.sh", "{{div .JOB_ITERATIONS .NAMESPACES_PER_CUDN}}"]
        when: beforeJobExecution
      - cmd: ["bash", "setup_external_frr_vrf.sh", "{{div .JOB_ITERATIONS .NAMESPACES_PER_CUDN}}", "{{.EXTERNAL_WEBSERVER_IP}}", "{{.L3VNI_START}}"]
        when: beforeJobExecution
      - cmd: ["bash", "cleanup_external_frr_vrf.sh", "{{div .JOB_ITERATIONS .NAMESPACES_PER_CUDN}}"]
        when: afterJobExecution
{{ end }}
    objects:
      - objectTemplate: cudn.yml
        replicas: 1
        repeatEveryNIterations: {{.NAMESPACES_PER_CUDN}}
        group:
          id: 0
          pauseBeforeGC: {{.JOB_PAUSE}}
        inputVars:
          namespaces_per_cudn: {{.NAMESPACES_PER_CUDN}}
          total_namespaces: {{.JOB_ITERATIONS}}
          scenario: "{{.SCENARIO}}"
          cudn_mode: "{{.CUDN_MODE}}"
          l3vni_start: {{.L3VNI_START}}

      - objectTemplate: ra.yml
        replicas: 1
        repeatEveryNIterations: {{.NAMESPACES_PER_CUDN}}
        group:
          id: 1
          pauseBeforeGC: {{.JOB_PAUSE}}

{{ if eq .SCENARIO "east-west" }}
      - objectTemplate: webserver-deployment.yml
        replicas: 1
        group:
          id: 2

      - objectTemplate: webserver-service.yml
        replicas: 1
        group:
          id: 2

      - objectTemplate: curl-deployment.yml
        replicas: 1
        group:
          id: 2
        inputVars:
          webserver_hostname: ""
          webserver_port: ""
{{ else }}
      - objectTemplate: curl-deployment.yml
        replicas: 1
        group:
          id: 2
        inputVars:
          webserver_hostname: "{{.EXTERNAL_WEBSERVER_IP}}"
          webserver_port: "{{.EXTERNAL_WEBSERVER_PORT}}"
{{ end }}
