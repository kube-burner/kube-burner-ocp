---
global:
  gc: {{.GC}}
  gcMetrics: {{.GC_METRICS}}
  deletionStrategy: {{.DELETION_STRATEGY}}
  measurements:
    - name: podLatency
{{ if ne .POD_READY_THRESHOLD 0 }}
      thresholds:
        - conditionType: Ready
          metric: P99
          threshold: {{.POD_READY_THRESHOLD}}
{{ end }}
{{ if .PPROF }}
    - name: pprof
      pprofInterval: {{.PPROF_INTERVAL}}
      pprofDirectory: pprof-data
{{ if .PPROF_NODE_TARGETS }}
      nodeAffinity:
        node-role.kubernetes.io/worker: ""
{{ end }}
      pprofTargets: {{.PPROF_TARGETS}}
{{ end }}
{{ if .SVC_LATENCY }}
    - name: serviceLatency
      svcTimeout: 10s
{{ end }}
metricsEndpoints:
{{ if .ES_SERVER }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{ end }}
{{ if .LOCAL_INDEXING }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      type: local
      metricsDirectory: collected-metrics-{{.UUID}}
{{ end }}

jobs:
{{ if .NUM_SRIOVS }}
  - name: node-density-cni-sriov
{{else}}
  - name: node-density-cni
{{ end }}
    namespace: node-density-cni
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: {{.NAMESPACED_ITERATIONS}}
    iterationsPerNamespace: {{.ITERATIONS_PER_NAMESPACE}}
    churnConfig:
      cycles: {{.CHURN_CYCLES}}
      duration: {{.CHURN_DURATION}}
      percent: {{.CHURN_PERCENT}}
      delay: {{.CHURN_DELAY}}
      mode: {{.CHURN_MODE}}
    podWait: false
    waitWhenFinished: true
    preLoadImages: true
    namespaceLabels:
      security.openshift.io/scc.podSecurityLabelSync: false
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged

    objects:
      - objectTemplate: webserver-deployment.yml
        replicas: 1
        inputVars:
          nodeSelector: {{.NODE_SELECTOR}}
          perfProfile: {{.PERF_PROFILE}}
          numSriovs: {{.NUM_SRIOVS}}
          sriovNetworkName: {{.SRIOV_NETWORK_NAME}}

      - objectTemplate: webserver-service.yml
        replicas: 1

      - objectTemplate: curl-deployment.yml
        replicas: 1
        inputVars:
          nodeSelector: {{.NODE_SELECTOR}}
          perfProfile: {{.PERF_PROFILE}}
          numSriovs: {{.NUM_SRIOVS}}
          sriovNetworkName: {{.SRIOV_NETWORK_NAME}}
