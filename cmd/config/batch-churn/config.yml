{{/*

  Batch-churn workload — API server stress via high-churn namespaces with
  heavy secret/configmap mounts.

  Pods mount secrets and configmaps as volumes. The kubelet opens a WATCH
  on the API server for each mounted secret/configmap, so the watch
  pressure scales with (pods × mounts per pod).

  Run via init workflow:
    cd batch-churn/
    kube-burner-ocp init -c config.yml --iterations 30 --churn-cycles 5

  Scale knobs (override with --set KEY=VALUE):
    RESOURCE_SIZE            Bytes per secret/configmap data field               (default: 16384)
    SECRETS_PER_POD          Secrets per namespace, mounted by every pod         (default: 20)
    CONFIGMAPS_PER_POD       ConfigMaps per namespace, mounted by every pod      (default: 20)
    DEPLOYMENT_COUNT         Deployments per namespace                           (default: 10)
    POD_REPLICAS             Pods per deployment                                 (default: 10)

  Chaos knobs:
    CHAOS_ACTION             Chaos to run during load (empty=none)               (default: "")
                             Options: rollout, kill-apiserver, kill-node, kill-etcd
    CHAOS_DELAY              Seconds to wait before chaos fires                  (default: 0)

  Built-in init flags also apply:
    --iterations N           Number of batch namespaces (required)
    --churn-cycles N         Churn cycles (default: 0 from init, recommend 5+)
    --churn-duration D       Per-cycle duration (recommend 5m)
    --churn-delay D          Delay between cycles (recommend 30s)
    --churn-percent N        Percent of namespaces churned per cycle (recommend 100)

  Watcher-spam mode (pure API server watch pressure, bypasses kubelet):
    WATCHER_MODE             Set to "true" to enable watcher-spam mode           (default: "false")
    SECRET_WATCHERS          Watch streams on secrets                            (default: 5000)
    CONFIGMAP_WATCHERS       Watch streams on configmaps                         (default: 5000)
    NODE_WATCHERS            Watch streams on nodes                              (default: 2000)
    ENDPOINT_WATCHERS        Watch streams on endpoints                          (default: 2000)
    SA_WATCHERS              Watch streams on serviceaccounts                    (default: 2000)
    EVENT_WATCHERS           Watch streams on events                             (default: 2000)
    POD_WATCHERS             Watch streams on pods                               (default: 2000)

    Watcher mode opens LIST+WATCH streams directly from the kube-burner
    process — no pods, no kubelet, no scheduling. Each watcher is a
    long-lived TLS connection to the API server, triggering RAND_bytes
    on every LIST/WATCH via the audit UUID path. A small set of
    configmaps/secrets is created as watch targets.

  Examples:
    # Load only, no chaos
    kube-burner-ocp init -c config.yml --iterations 30 --churn-cycles 5

    # Soft rollout of API servers under load
    kube-burner-ocp init -c config.yml --iterations 30 --churn-cycles 5 \
      --set CHAOS_ACTION=rollout

    # Kill a master node 60s after load is created
    kube-burner-ocp init -c config.yml --iterations 30 --churn-cycles 5 \
      --set CHAOS_ACTION=kill-node --set CHAOS_DELAY=60

    # Force etcd leader election under load
    kube-burner-ocp init -c config.yml --iterations 30 --churn-cycles 5 \
      --set CHAOS_ACTION=kill-etcd

    # Watcher-spam mode — 20k direct watches + API server rollout
    kube-burner-ocp init -c config.yml --iterations 1 \
      --set WATCHER_MODE=true \
      --set CHAOS_ACTION=rollout --set CHAOS_DELAY=60

    # Watcher-spam mode — scale up to 16k watches
    export JOB_PAUSE=15m
    kube-burner-ocp init -c config.yml --iterations 1 \
    --set WATCHER_MODE=true \
    --set SECRET_WATCHERS=8000 \
    --set CONFIGMAP_WATCHERS=8000 \
    --set NODE_WATCHERS=0 \
    --set ENDPOINT_WATCHERS=0 \
    --set SA_WATCHERS=0 \
    --set EVENT_WATCHERS=0 \
    --set POD_WATCHERS=0 \
    --set CHAOS_ACTION=kill-node \
    --set CHAOS_DELAY=5 \
    --metrics-profile=metrics.yml,etcd-density-metrics.yml \
    --profile-type=regular \
    --es-server='ES_SERVER' \
    --es-index='ES_INDEX'

*/}}
{{- $resourceSize := .RESOURCE_SIZE | default 16384 | int -}}
{{- $secretsPerPod := .SECRETS_PER_POD | default 20 | int -}}
{{- $configmapsPerPod := .CONFIGMAPS_PER_POD | default 20 | int -}}
{{- $deploymentCount := .DEPLOYMENT_COUNT | default 10 | int -}}
{{- $podReplicas := .POD_REPLICAS | default 10 | int -}}
{{- $secretEnd := add $secretsPerPod 1 | int -}}
{{- $cmEnd := add $configmapsPerPod 1 | int -}}
{{- $chaosAction := .CHAOS_ACTION | default "" -}}
{{- $chaosDelay := .CHAOS_DELAY | default "0" -}}
{{- $churnCycles := .CHURN_CYCLES | default 5 | int -}}
{{- $churnDuration := .CHURN_DURATION | default "5m0s" -}}
{{- $churnDelay := .CHURN_DELAY | default "30s" -}}
{{- $churnPercent := .CHURN_PERCENT | default 100 | int -}}
{{- $churnMode := .CHURN_MODE | default "namespaces" -}}
{{- $deletionStrategy := .DELETION_STRATEGY | default "default" -}}
{{- $iterations := .JOB_ITERATIONS | default 30 | int -}}
{{- $watcherMode := .WATCHER_MODE | default false -}}
{{- $secretWatchers := ternary (.SECRET_WATCHERS | int) 5000 (ne .SECRET_WATCHERS nil) -}}
{{- $configmapWatchers := ternary (.CONFIGMAP_WATCHERS | int) 5000 (ne .CONFIGMAP_WATCHERS nil) -}}
{{- $nodeWatchers := ternary (.NODE_WATCHERS | int) 2000 (ne .NODE_WATCHERS nil) -}}
{{- $endpointWatchers := ternary (.ENDPOINT_WATCHERS | int) 2000 (ne .ENDPOINT_WATCHERS nil) -}}
{{- $saWatchers := ternary (.SA_WATCHERS | int) 2000 (ne .SA_WATCHERS nil) -}}
{{- $eventWatchers := ternary (.EVENT_WATCHERS | int) 2000 (ne .EVENT_WATCHERS nil) -}}
{{- $podWatchers := ternary (.POD_WATCHERS | int) 2000 (ne .POD_WATCHERS nil) -}}
---
global:
  gc: {{.GC}}
  gcMetrics: {{.GC_METRICS}}
  deletionStrategy: {{ $deletionStrategy }}
  measurements:
    - name: podLatency

metricsEndpoints:
{{ if .ES_SERVER }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      esServers: ["{{.ES_SERVER}}"]
      insecureSkipVerify: true
      defaultIndex: {{.ES_INDEX}}
      type: opensearch
{{ end }}
{{ if .LOCAL_INDEXING }}
  - metrics: [{{.METRICS}}]
    alerts: [{{.ALERTS}}]
    indexer:
      type: local
      metricsDirectory: collected-metrics-{{.UUID}}
{{ end }}

jobs:
{{ if $watcherMode }}
  - name: watcher-spam-seed
    namespace: watcher-spam
    jobIterations: 1
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: false
    podWait: false
    waitWhenFinished: true
    namespaceLabels:
      security.openshift.io/scc.podSecurityLabelSync: "false"
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
    objects:
      - objectTemplate: secret.yml
        replicas: 10
        inputVars:
          resourceSize: {{ $resourceSize }}
      - objectTemplate: configmap.yml
        replicas: 10
        inputVars:
          resourceSize: {{ $resourceSize }}

  - name: watcher-spam
    namespace: watcher-spam
    jobIterations: 1
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: false
    jobPause: {{.JOB_PAUSE}}
{{ if $chaosAction }}
    hooks:
    - cmd: ["chaos.sh", "{{ $chaosAction }}", "{{ $chaosDelay }}", "3"]
      when: afterJobExecution
{{ end }}
    watchers:
      - kind: Secret
        apiVersion: v1
        labelSelector:
          kube-burner-job: watcher-spam-seed
        replicas: {{ $secretWatchers }}

      - kind: ConfigMap
        apiVersion: v1
        labelSelector:
          kube-burner-job: watcher-spam-seed
        replicas: {{ $configmapWatchers }}

      - kind: Node
        apiVersion: v1
        labelSelector: {}
        replicas: {{ $nodeWatchers }}

      - kind: Endpoints
        apiVersion: v1
        labelSelector: {}
        replicas: {{ $endpointWatchers }}

      - kind: ServiceAccount
        apiVersion: v1
        labelSelector: {}
        replicas: {{ $saWatchers }}

      - kind: Event
        apiVersion: v1
        labelSelector: {}
        replicas: {{ $eventWatchers }}

      - kind: Pod
        apiVersion: v1
        labelSelector: {}
        replicas: {{ $podWatchers }}

{{ else }}
  - name: batch-churn
    namespace: batch-churn
    jobIterations: {{ $iterations }}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: true
    podWait: false
    waitWhenFinished: true
    preLoadImages: true
    churnConfig:
      cycles: {{ $churnCycles }}
      duration: {{ $churnDuration }}
      percent: {{ $churnPercent }}
      delay: {{ $churnDelay }}
      mode: {{ $churnMode }}
    namespaceLabels:
      security.openshift.io/scc.podSecurityLabelSync: "false"
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/warn: privileged
{{ if $chaosAction }}
    hooks:
    - cmd: ["chaos.sh", "{{ $chaosAction }}", "{{ $chaosDelay }}", "3"]
      when: afterJobExecution
{{ end }}
    objects:

      - objectTemplate: secret.yml
        replicas: {{ $secretsPerPod }}
        inputVars:
          resourceSize: {{ $resourceSize }}

      - objectTemplate: configmap.yml
        replicas: {{ $configmapsPerPod }}
        inputVars:
          resourceSize: {{ $resourceSize }}

      - objectTemplate: deployment.yml
        replicas: {{ $deploymentCount }}
        inputVars:
          podReplicas: {{ $podReplicas }}
          secretIndices: {{ untilStep 1 $secretEnd 1 | toJson }}
          configmapIndices: {{ untilStep 1 $cmEnd 1 | toJson }}
{{ end }}
