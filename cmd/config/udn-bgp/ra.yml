apiVersion: k8s.ovn.org/v1
kind: RouteAdvertisements
metadata:
  name: ra-{{.Iteration}}
spec:
  nodeSelector: {}
  frrConfigurationSelector: {}
  networkSelectors:
    - networkSelectionType: ClusterUserDefinedNetworks
      clusterUserDefinedNetworkSelector:
        networkSelector:
          matchLabels:
            kube-burner.io/udn-bgp-ra: "{{.Iteration}}"
  advertisements:
  - "PodNetwork"
{{- if not $.layer2 }}
  - "EgressIP"
{{- end }}
